[package]
name = "suitcase"
version = "26.0.0"
description = "Unofficial Windows-first desktop client for Koofr"
authors = ["Suitcase contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.88"

[lib]
name = "suitcase_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
cc = "1.2.56"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
futures-util = "0.3.32"
filetime = "0.2.26"
chardetng = "0.1.17"
data-encoding = "2.9.0"
encoding_rs = "0.8.35"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "tiff"] }
keyring-core = "1.0.0"
md-5 = "0.10.6"
notify = "8.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "query", "rustls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.5"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["compat", "io", "rt"] }
trash = "5.2.5"
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4"] }
vault-crypto = { git = "https://github.com/koofr/vault.git", rev = "17c95914dbc25f42f71869d1878f58a6675474ce" }
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_CorrelationVector", "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
zeroize = "1.8.2"

[dev-dependencies]
httpmock = "0.8.2"
tokio = { version = "1.50.0", features = ["test-util"] }
